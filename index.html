<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aligelbrot – Links</title>
<meta name="description" content="Alle Links von aligelbrot: Gaming auf Twitch, YouTube und TikTok, Social und Fußballtalk sowie der Discord-Server.">
<meta name="theme-color" content="#0e0d10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  @property --angle {
    syntax: "<angle>";
    initial-value: 0deg;
    inherits: false;
  }

  :root {
    --gold: rgb(216, 152, 71);
    --red: #e5503f;
    --blurple: #8a94ff;
    --bg: #0e0d10;
    --card: #17151a;
    --text: #f3ece1;
    --muted: #9c9488;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 16px;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(216, 152, 71, 0.18), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  main {
    width: 100%;
    max-width: 360px;
    text-align: center;
  }

  h1 {
    font-family: "Bebas Neue", Impact, sans-serif;
    font-weight: 400;
    font-size: clamp(3.2rem, 14vw, 4.6rem);
    letter-spacing: 0.06em;
    line-height: 1;
    color: var(--text);
  }

  /* gelb = Gold, rot = Rot: so erkennt man auf einen Blick, welcher Kanal gemeint ist */
  .g { color: var(--gold); }
  .r { color: var(--red); }

  .tagline {
    margin: 8px 0 8px;
    color: var(--muted);
    font-size: 0.95rem;
  }

  /* Drei Bereiche mit eigener Akzentfarbe: Gold = Gaming, Rot = Social, Violett = Community */
  .section {
    margin-top: 30px;
    --accent: var(--gold);
    --accent-soft: rgba(216, 152, 71, 0.14);
    --accent-line: rgba(216, 152, 71, 0.26);
    --accent-glow: rgba(216, 152, 71, 0.24);
  }

  .section.social {
    --accent: var(--red);
    --accent-soft: rgba(229, 80, 63, 0.14);
    --accent-line: rgba(229, 80, 63, 0.3);
    --accent-glow: rgba(229, 80, 63, 0.26);
  }

  .section.community {
    --accent: var(--blurple);
    --accent-soft: rgba(138, 148, 255, 0.14);
    --accent-line: rgba(138, 148, 255, 0.3);
    --accent-glow: rgba(138, 148, 255, 0.26);
  }

  .section-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
    text-align: left;
  }

  .badge {
    flex: none;
    width: 52px;
    height: 52px;
    display: grid;
    place-items: center;
    border-radius: 13px;
    background: var(--accent-soft);
    border: 2px solid var(--accent-line);
    color: var(--accent);
  }

  .badge svg { width: 30px; height: 30px; }

  h2 {
    font-family: "Bebas Neue", Impact, sans-serif;
    font-weight: 400;
    font-size: 1.75rem;
    letter-spacing: 0.08em;
    line-height: 1.05;
    color: var(--accent);
  }

  .section-head p {
    color: var(--muted);
    font-size: 1rem;
  }

  .section-head p .g,
  .section-head p .r { font-weight: 600; }

  .link {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    margin-bottom: 10px;
    border: 2px solid var(--accent-line);
    border-radius: 14px;
    background: var(--card);
    color: var(--text);
    text-decoration: none;
    text-align: left;
    transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  }

  .link:hover,
  .link:focus-visible {
    transform: translateY(-2px);
    border-color: var(--accent);
    box-shadow: 0 6px 24px var(--accent-glow);
    outline: none;
  }

  .ico {
    flex: none;
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    background: var(--accent-soft);
    color: var(--accent);
  }

  .ico svg { width: 28px; height: 28px; }

  .text { flex: 1; min-width: 0; }

  .name {
    display: block;
    font-family: "Bebas Neue", Impact, sans-serif;
    font-size: 2.2rem;
    letter-spacing: 0.06em;
    line-height: 1.05;
  }

  .handle {
    display: block;
    margin-top: 2px;
    color: var(--muted);
    font-size: 1.05rem;
  }

  .handle .g,
  .handle .r { font-weight: 600; }

  .arrow {
    color: var(--accent);
    font-size: 1.4rem;
    transition: transform 0.18s ease;
  }

  .link:hover .arrow { transform: translateX(4px); }

  /* Haupt-Link: rotierender Gelb-Rot-Verlauf wie im Stream-Overlay */
  .link.main {
    border-color: transparent;
    background:
      linear-gradient(var(--card), var(--card)) padding-box,
      conic-gradient(from var(--angle), var(--gold), #c8372d, var(--gold)) border-box;
    animation: spin 6s linear infinite;
  }

  .link.main .name { color: var(--gold); }

  @keyframes spin { to { --angle: 360deg; } }

  footer {
    margin-top: 34px;
    color: var(--muted);
    font-size: 0.8rem;
  }

  @media (prefers-reduced-motion: reduce) {
    .link.main { animation: none; }
    .link, .arrow { transition: none; }
  }
</style>
</head>
