<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aligelbrot – Links</title>
<meta name="description" content="Alle Links von aligelbrot: Twitch, YouTube und TikTok.">
<meta name="theme-color" content="#0e0d10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  @property --angle {
    syntax: "<angle>";
    initial-value: 0deg;
    inherits: false;
  }

  :root {
    --gold: rgb(216, 152, 71);
    --red: #c8372d;
    --bg: #0e0d10;
    --card: #17151a;
    --text: #f3ece1;
    --muted: #9c9488;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 16px;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(216, 152, 71, 0.18), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  main {
    width: 100%;
    max-width: 440px;
    text-align: center;
  }

  h1 {
    font-family: "Bebas Neue", Impact, sans-serif;
    font-weight: 400;
    font-size: clamp(3.2rem, 14vw, 4.6rem);
    letter-spacing: 0.06em;
    line-height: 1;
    color: var(--gold);
  }

  .tagline {
    margin: 8px 0 32px;
    color: var(--muted);
    font-size: 0.95rem;
  }

  h2 {
    margin: 28px 0 10px;
    text-align: left;
    font-family: "Bebas Neue", Impact, sans-serif;
    font-weight: 400;
    font-size: 1.1rem;
    letter-spacing: 0.14em;
    color: var(--muted);
  }

  .link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 20px;
    margin-bottom: 10px;
    border: 2px solid rgba(216, 152, 71, 0.22);
    border-radius: 14px;
    background: var(--card);
    color: var(--text);
    text-decoration: none;
    text-align: left;
    transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  }

  .link:hover,
  .link:focus-visible {
    transform: translateY(-2px);
    border-color: var(--gold);
    box-shadow: 0 6px 24px rgba(216, 152, 71, 0.22);
    outline: none;
  }

  .name {
    display: block;
    font-family: "Bebas Neue", Impact, sans-serif;
    font-size: 1.7rem;
    letter-spacing: 0.06em;
    line-height: 1.1;
  }

  .handle {
    display: block;
    margin-top: 2px;
    color: var(--muted);
    font-size: 0.85rem;
  }

  .arrow {
    color: var(--gold);
    font-size: 1.4rem;
    transition: transform 0.18s ease;
  }

  .link:hover .arrow { transform: translateX(4px); }

  /* Haupt-Link: rotierender Gelb-Rot-Verlauf wie im Stream-Overlay */
  .link.main {
    border-color: transparent;
    background:
      linear-gradient(var(--card), var(--card)) padding-box,
      conic-gradient(from var(--angle), var(--gold), var(--red), var(--gold)) border-box;
    animation: spin 6s linear infinite;
  }

  .link.main .name { color: var(--gold); }

  @keyframes spin { to { --angle: 360deg; } }

  footer {
    margin-top: 32px;
    color: var(--muted);
    font-size: 0.8rem;
  }

  @media (prefers-reduced-motion: reduce) {
    .link.main { animation: none; }
    .link, .arrow { transition: none; }
  }
</style>
</head>
<body>
  <main>
    <h1>aligelbrot</h1>
    <p class="tagline">Twitch · YouTube · TikTok</p>

    <a class="link main" href="https://www.twitch.tv/aligelbrot" target="_blank" rel="noopener noreferrer">
      <span><span class="name">Twitch</span><span class="handle">@aligelbrot</span></span>
      <span class="arrow" aria-hidden="true">→</span>
    </a>

    <h2>YouTube</h2>
    <a class="link" href="https://www.youtube.com/@aligelbrot" target="_blank" rel="noopener noreferrer">
      <span><span class="name">YouTube</span><span class="handle">@aligelbrot</span></span>
      <span class="arrow" aria-hidden="true">→</span>
    </a>
    <a class="link" href="https://www.youtube.com/@alirotgelb" target="_blank" rel="noopener noreferrer">
      <span><span class="name">YouTube</span><span class="handle">@alirotgelb</span></span>
      <span class="arrow" aria-hidden="true">→</span>
    </a>

    <h2>TikTok</h2>
    <a class="link" href="https://www.tiktok.com/@aligelbrot" target="_blank" rel="noopener noreferrer">
      <span><span class="name">TikTok</span><span class="handle">@aligelbrot</span></span>
      <span class="arrow" aria-hidden="true">→</span>
    </a>
    <a class="link" href="https://www.tiktok.com/@alirotgelb" target="_blank" rel="noopener noreferrer">
      <span><span class="name">TikTok</span><span class="handle">@alirotgelb</span></span>
      <span class="arrow" aria-hidden="true">→</span>
    </a>

    <footer>© aligelbrot</footer>
  </main>
</body>
</html>
